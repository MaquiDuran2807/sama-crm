[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sama-adtech"
version = "0.1.0"
description = "CRM multi-tenant para la industria AdTech con IA generativa"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<7.0",
    "djangorestframework",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "ARG"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sama_core.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["crm", "tenants", "ingesta", "auth", "core"]
addopts = "--reuse-db --cov=crm --cov=tenants --cov=auth --cov=ingesta --cov=core --cov-report=term-missing --cov-report=html"
