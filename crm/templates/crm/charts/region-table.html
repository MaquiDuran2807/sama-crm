{% comment %} Region Table chart partial {% endcomment %}
<div class="chart-card">
    <div class="chart-title">Datos por departamento</div>
    <div class="table-responsive">
        <table class="table table-hover mb-0 region-table" id="region-table">
            <thead>
                <tr>
                    <th>Departamento</th>
                    <th class="text-center">Leads</th>
                    <th class="text-center">Ganados</th>
                    <th class="text-center">Perdidos</th>
                    <th class="text-center">Conv.%</th>
                </tr>
            </thead>
            <tbody id="region-table-body">
                <tr><td colspan="5" class="text-center text-muted py-4">Sin datos disponibles</td></tr>
            </tbody>
        </table>
    </div>
</div>
